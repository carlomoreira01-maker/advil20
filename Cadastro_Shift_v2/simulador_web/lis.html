<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>LIS fictício — treinamento RPA</title>
<style>body{font:16px system-ui;background:#f5f7fb;color:#1e293b;max-width:1050px;margin:25px auto}section{background:white;padding:24px;margin:18px 0;border-radius:10px}input,select,textarea,button{font:inherit;padding:9px;margin:5px;border:1px solid #cbd5e1;border-radius:5px}button{background:#2457d6;color:white}label{display:inline-block}pre{white-space:pre-wrap}.label{border:2px dashed #64748b;padding:12px;margin:10px}</style>
<h1>LIS fictício · treinamento da automação</h1><p>Ambiente local, separado do Shift. Somente dados e etiquetas de demonstração.</p>
<section><h2>1. Pesquisar e confirmar paciente existente</h2><label>Nome<input id="nome"></label><label>Nascimento<input id="nascimento"></label><label>Carteira<input id="carteira"></label><button id="search">Pesquisar</button><pre id="patient"></pre><label><input id="identity" type="checkbox">Conferi os identificadores do cadastro encontrado</label><button id="select">Confirmar cadastro existente</button></section>
<section><h2>2. Cadastro da O.S. fictícia</h2><label>Atendimento<input id="case_id"></label><label>Fonte pagadora<select id="payer"><option value="">Selecione</option><option value="FONTE-FICTICIA">Fonte pagadora fictícia homologada para treino</option></select></label><br><label>Guia prestador<input id="guide"></label><label>Guia principal<input id="main_guide"></label><label>Guia operadora<input id="operator_guide"></label><label>Senha/autorização<input id="password"></label><br><label>CRM<input id="crm"></label><label>UF<input id="uf"></label><button id="doctor">Selecionar médico cadastrado</button><p id="doctor_result"></p><label>Procedimentos validados (código;quantidade)<br><textarea id="exams" rows="5" cols="48"></textarea></label><br><label>Pedido e guia sintéticos<input id="files" type="file" multiple></label><p id="file_status"></p></section>
<section><h2>3. Conferência final e etiquetas</h2><p>Confira os valores preenchidos antes de continuar.</p><label><input id="final" type="checkbox">Confirmo identidade, fonte pagadora, médico, exames e autorização</label><button id="authorize">Autorizar a RPA a criar O.S. fictícia</button><button id="create">Criar O.S. fictícia</button><pre id="result"></pre><button id="labels">Gerar etiquetas de demonstração</button><div id="label_preview"></div></section>
<script>
const el=id=>document.getElementById(id),query=()=>Object.fromEntries(['nome','nascimento','carteira'].map(k=>[k,el(k).value]));let patient=null;window.attachments=[];window.identityConfirmed=false;window.humanFinal=false;let order=null;
async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Demo-Session':'__NONCE__'},body:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error);return v}
const handle=f=>async()=>{try{await f()}catch(e){el('result').textContent=e.message}};
el('search').onclick=handle(async()=>{const found=await api('/search',query());patient=found.length===1?found[0]:null;el('patient').textContent=patient?'Cadastro '+patient.id+'\nPaciente: '+patient.nome+'\nNascimento: '+patient.nascimento+'\nCarteira: '+patient.carteira:'Sem correspondência única. Solicite os identificadores faltantes.';window.identityConfirmed=false;el('identity').checked=false});
el('select').onclick=handle(async()=>{const r=await api('/select',{query:query(),id:patient?.id,reviewed:el('identity').checked});window.identityConfirmed=r.selected;el('result').textContent='Cadastro existente confirmado. Aguarde o preenchimento assistido.'});
for(const k of ['nome','nascimento','carteira'])el(k).oninput=()=>{window.identityConfirmed=false;patient=null;el('identity').checked=false};
for(const k of ['case_id','payer','guide','main_guide','operator_guide','password','crm','uf','exams'])el(k).oninput=()=>{el('final').checked=false;window.humanFinal=false};
el('doctor').onclick=()=>{el('doctor_result').textContent=el('crm').value==='0012345'&&el('uf').value==='GO'?'SIM-M1 · DRA EXEMPLO SINTETICA':'Médico não encontrado. Não cadastrar automaticamente.'};
el('files').onchange=handle(async()=>{window.attachments=[];for(const f of el('files').files){let bytes=await f.arrayBuffer(),hash=await crypto.subtle.digest('SHA-256',bytes);window.attachments.push({name:f.name,sha256:Array.from(new Uint8Array(hash)).map(v=>v.toString(16).padStart(2,'0')).join('')})}el('file_status').textContent=window.attachments.length+' documentos fictícios anexados';el('final').checked=false;window.humanFinal=false});
el('authorize').onclick=()=>{window.humanFinal=el('final').checked;el('result').textContent=window.humanFinal?'Confirmação humana recebida.':'Marque a conferência final antes de autorizar.'};
el('create').onclick=handle(async()=>{const data={patient:query(),exams:el('exams').value.trim().split('\n').map(row=>{let [code,quantity]=row.split(';');return {code,quantity:Number(quantity)}})};for(const k of ['case_id','payer','guide','main_guide','operator_guide','password','crm','uf'])data[k]=el(k).value;order=await api('/order',{data,attachments:window.attachments,final:el('final').checked});el('result').textContent='O.S. fictícia: '+order.os_simulada+'\nCadastro reutilizado: '+order.patient_id+'\nMédico cadastrado: '+order.doctor_id+'\nNenhuma O.S. real foi criada. As cinco etiquetas são de demonstração.'});
el('labels').onclick=()=>{el('label_preview').replaceChildren();if(!order){el('result').textContent='Crie a O.S. fictícia após a conferência.';return}for(const text of order.labels){let item=document.createElement('div');item.className='label';item.textContent=text+' · '+order.os_simulada;el('label_preview').appendChild(item)}};
</script></html>
