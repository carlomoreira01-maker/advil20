<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Simulação local — Cadastro Assistido Shift</title><style>body{font:16px system-ui;background:#edf3f7;color:#173d52;max-width:900px;margin:30px auto}section{background:white;border-radius:12px;padding:22px;margin:14px 0}input,button{padding:10px;margin:5px;border:1px solid #b6c5cd;border-radius:6px}button{background:#173d52;color:white}label{display:inline-block}#status{white-space:pre-wrap}</style><h1>Laboratório fictício · simulação local</h1><p>Sem acesso ao Shift real. Todos os dados e códigos abaixo são fictícios.</p><section><h2>1. Identificar paciente</h2><label>Nome<input id="nome" value="PESSOA FICTICIA ALFA"></label><label>Nascimento<input id="nascimento" value="01/02/1995"></label><label>Carteira<input id="carteira" value="0000087654"></label><button id="search">Pesquisar</button><div id="patient"></div><label><input id="identity" type="checkbox">Conferi a identidade e os documentos</label><button id="confirm">Confirmar cadastro existente</button></section><section><h2>2. Preparar atendimento fictício</h2><input id="case" aria-label="Atendimento" value="CASO-FICTICIO-1"><input id="payer" aria-label="Fonte pagadora" value="CONVENIO FICTICIO"><input id="guide" aria-label="Guia" value="00000111"><input id="crm" aria-label="CRM" value="0012345"><input id="uf" aria-label="UF" value="GO"><button id="doctor">Conferir médico existente</button><p>Procedimento fictício 90000001 · quantidade 1</p><label>Pedido e guia fictícios<input id="files" type="file" multiple></label><label><input type="checkbox" id="review">Conferi campos, exames e autorização</label><button id="prepare">Preparar O.S. simulada</button></section><section id="status" role="status">Aguardando pesquisa e revisão.</section><script>
let patient=null,token=null;const el=id=>document.getElementById(id),query=()=>({nome:el('nome').value,nascimento:el('nascimento').value,carteira:el('carteira').value});
async function api(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error);return v}
function handle(fn){return async()=>{try{await fn()}catch(e){el('status').textContent=e.message}}}
el('search').onclick=handle(async()=>{let found=await api('/search',query());patient=found.length===1?found[0]:null;token=null;el('patient').textContent=patient?'Cadastro encontrado: '+patient.id:'Nenhuma correspondência única';el('status').textContent=el('patient').textContent});
el('confirm').onclick=handle(async()=>{if(!patient)throw Error('Pesquise uma correspondência única.');let r=await api('/confirm',{query:query(),patient_id:patient.id,reviewed:el('identity').checked});token=r.token;el('status').textContent='Identidade confirmada na simulação.'});
for(let id of ['nome','nascimento','carteira'])el(id).oninput=()=>{token=null;patient=null;el('identity').checked=false};
el('doctor').onclick=handle(async()=>{let d=await api('/doctor',{crm:el('crm').value,uf:el('uf').value});el('status').textContent='Solicitante fictício localizado: '+d.nome});
el('prepare').onclick=handle(async()=>{let result=await api('/prepare',{token,reviewed:el('review').checked,case_id:el('case').value,payer:el('payer').value,guide:el('guide').value,crm:el('crm').value,uf:el('uf').value,exams:[{code:'90000001',quantity:1}],attachments:Array.from(el('files').files).map(f=>({name:'documento ficticio',size:f.size}))});el('status').textContent=JSON.stringify(result,null,2)});
</script></html>
